# Javascript Node CircleCI 2.0 configuration file
version: 2
jobs:
  build:
    working_directory: ~/emerald
    docker:
      - image: circleci/node:7.10
    steps:
      - checkout
      - run: sudo npm install -g pm2 
      - run: cd ./back-end && npm install && npm run test
      - add_ssh_keys:
          fingerprints:
            - "7f:7c:8b:00:18:6c:c8:3f:10:39:34:4a:5e:a3:cf:74"
      - run: echo $REMOTE_HOSTKEY >> ~/.ssh/known_hosts
  deploy:
    working_directory: ~/emerald
    docker: 
      - image: circleci/node:7.10
    steps:
      - checkout
      # - run: sudo npm install -g pm2 
      - run: cd ./back-end && pm2 deploy ecosystem.config.js production

workflows:
  version: 2
  build_and_test:
    jobs: 
      - build:
          filters:
            branches:
              only: amelieykw_backend
      - deploy:
          requires:
            - build
          filters:
            branches:
              only: amelieykw_backend



